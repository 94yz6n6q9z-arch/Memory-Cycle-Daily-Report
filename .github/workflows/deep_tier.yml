name: Memory Cycle Brief — Deep Tier (overnight)

on:
  schedule:
    # 10:00 UTC daily (12:00 CEST / 11:00 CET = 19:00 KST). v3.39.3+:
    # moved 08:00 → 10:00 to align with the END of the Korean broker
    # publishing window. Korean desks publish post-close notes between
    # KRX close (06:30 UTC = 15:30 KST) and ~19:00 KST (10:00 UTC),
    # so firing at 10:00 UTC catches them all rather than missing the
    # final 1-2 hours of broker output. Note: this tightens the buffer
    # before fast_tier (11:00 UTC) to ~1 hour. With Korean broker PDF
    # scrapers temporarily inert (NH/Samsung dead; Mirae pending v3.39.4
    # HTML rewrite), the Layer 1 digester load is lighter — current
    # runtime is ~4-6 min so 1 hour is adequate. If Mirae HTML scraper
    # adds back substantial digester load in v3.39.4, revisit this.
    #
    # The original 08:00 UTC was optimized for US after-hours transcript
    # availability (~94% scrape-able by 6.5h post-call median). That
    # bias was sub-optimal for the Korean signals which are the higher
    # weight in this brief — US transcripts are mostly available from
    # Yahoo Finance by 10:00 UTC anyway (~98% per same curve).
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # commits digests + caches back to repo

concurrency:
  group: memory-cycle-brief-deep
  cancel-in-progress: false

jobs:
  deep-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # PDF parsing + digester is slower than fast tier

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deep tier (transcripts + Korean broker PDFs + Layer 1 digester)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Samsung Securities Global — separate Gmail inbox for IMAP poll
          SAMSUNG_GMAIL_USER: ${{ secrets.SAMSUNG_GMAIL_USER }}
          SAMSUNG_GMAIL_APP_PW: ${{ secrets.SAMSUNG_GMAIL_APP_PW }}
          HAIKU_MODEL_OVERRIDE: ${{ secrets.HAIKU_MODEL_OVERRIDE }}
          # v3.33: Bright Data residential proxy for Yahoo Finance transcript
          # scraping. Yahoo blocks datacenter IPs (incl. GitHub Actions runners)
          # with 404. Format: http://USER-country-us:PASS@brd.superproxy.io:33335
          # The transcript scraper appends a per-request -session-{n} token
          # for residential-IP rotation. If unset, Yahoo fallback degrades to
          # "nothing" gracefully; Motley Fool + IR continue to work.
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
        run: |
          python -m src.deep_tier

      - name: Commit digests + caches
        run: |
          git config --global user.name "memory-cycle-brief-bot"
          git config --global user.email "bot@memory-cycle-brief"
          git add -A state/digests/ state/cache/
          # v3.38.5: these two files are written by deep_tier.py since v3.38
          # (DiagnosticsCollector persistence + transcript_status), but they
          # live in state/ directly — not under state/digests/ or state/cache/
          # — so the prior `git add` line missed them. They were generated on
          # the runner each day and destroyed at runner shutdown. The fast
          # tier (separate run, fresh checkout) reported FAIL "deep tier hasn't
          # run since v3.38 deploy" — misleading; deep tier DID run, but its
          # diagnostics were never committed. File-existence guards so the
          # workflow doesn't break on the rare run where deep_tier.py errored
          # before writing one of the files.
          [ -f state/deep_tier_diagnostics.json ] && git add state/deep_tier_diagnostics.json
          [ -f state/transcript_status.json ] && git add state/transcript_status.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Deep tier digests $(date -u +%Y-%m-%d)"
            # v3.34: rebase onto remote main before pushing — handles the case
            # where Raul (or another commit) pushed to main while this run was
            # in flight (3-5 minutes), making our local checkout stale. Without
            # rebase, push is rejected with "fetch first" and the digests are
            # lost. Retry once with a fresh pull if the first push still fails.
            git pull --rebase origin main || true
            git push || (sleep 5 && git pull --rebase origin main && git push)
          fi
