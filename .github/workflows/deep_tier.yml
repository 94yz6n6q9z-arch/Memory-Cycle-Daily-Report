name: Memory Cycle Brief — Deep Tier (overnight)

on:
  schedule:
    # 08:00 UTC daily (10:00 CEST / 09:00 CET) — aligns with the empirical
    # Yahoo/Quartr transcript availability curve (median ~6.5h post US call end,
    # so by 08:00 UTC ~94% of US after-hours transcripts are scrape-able).
    # Pulls slow sources: earnings transcripts (Yahoo Finance + Motley Fool +
    # IR-site scrapers per v3.31/v3.32) and Korean broker English PDFs
    # (Mirae/NH/Samsung Securities, 24-48hr lag). Runs the Layer 1 digester
    # (Haiku) over each large document and persists JSON digests to
    # state/digests/{YYYY-MM-DD}/ for the fast tier (11:00 UTC) to consume.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # commits digests + caches back to repo

concurrency:
  group: memory-cycle-brief-deep
  cancel-in-progress: false

jobs:
  deep-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # PDF parsing + digester is slower than fast tier

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deep tier (transcripts + Korean broker PDFs + Layer 1 digester)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Samsung Securities Global — separate Gmail inbox for IMAP poll
          SAMSUNG_GMAIL_USER: ${{ secrets.SAMSUNG_GMAIL_USER }}
          SAMSUNG_GMAIL_APP_PW: ${{ secrets.SAMSUNG_GMAIL_APP_PW }}
          HAIKU_MODEL_OVERRIDE: ${{ secrets.HAIKU_MODEL_OVERRIDE }}
          # v3.33: Bright Data residential proxy for Yahoo Finance transcript
          # scraping. Yahoo blocks datacenter IPs (incl. GitHub Actions runners)
          # with 404. Format: http://USER-country-us:PASS@brd.superproxy.io:33335
          # The transcript scraper appends a per-request -session-{n} token
          # for residential-IP rotation. If unset, Yahoo fallback degrades to
          # "nothing" gracefully; Motley Fool + IR continue to work.
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
        run: |
          python -m src.deep_tier

      - name: Commit digests + caches
        run: |
          git config --global user.name "memory-cycle-brief-bot"
          git config --global user.email "bot@memory-cycle-brief"
          git add -A state/digests/ state/cache/
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Deep tier digests $(date -u +%Y-%m-%d)"
            # v3.34: rebase onto remote main before pushing — handles the case
            # where Raul (or another commit) pushed to main while this run was
            # in flight (3-5 minutes), making our local checkout stale. Without
            # rebase, push is rejected with "fetch first" and the digests are
            # lost. Retry once with a fresh pull if the first push still fails.
            git pull --rebase origin main || true
            git push || (sleep 5 && git pull --rebase origin main && git push)
          fi
