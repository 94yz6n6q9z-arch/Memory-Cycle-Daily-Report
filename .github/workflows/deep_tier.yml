name: Memory Cycle Brief — Deep Tier (overnight)

# Revision history (most recent at top — inline markers throughout the file
# detail the specific section a revision touched):
#   v3.39.9 (2026-05-30) — schedule: (1) pulled all crons 30 min earlier
#                          (07:03–08:03 UTC → 06:33–07:33 UTC) so deep_tier
#                          tends to clear GitHub's (delayed) schedule queue
#                          before fast_tier's cron fallbacks fire; (2) trimmed
#                          from 5 crons to 3 (06:33 / 07:03 / 07:33 UTC, 30-min
#                          spacing) to match fast_tier's 3-cron fallback
#                          cadence — the idempotency gate makes extra fallback
#                          crons redundant once one run/day succeeds. On
#                          2026-05-30 a fast_tier cron (#92) was pulled off
#                          the queue 1 min BEFORE deep_tier (#83) because both
#                          shared the same 07:03 UTC first cron; #92 correctly
#                          no-op'd via its cascade gate, but the 30-min head
#                          start removes the daily redundant pre-deep run.
#                          Companion change: fast_tier.yml v3.39.9 (concurrency
#                          guard + dropped its 4th cron). Korean broker note:
#                          first cron now 15:33 KST (3 min after KRX close) on
#                          the cron clock, but the 90–180 min GitHub delay
#                          means actual fire is ~17:00–18:30 KST, still well
#                          inside the broker post-close window on normal days.
#   v3.39.8 (2026-05-29) — schedule: pulled all 5 crons another 1h 30min
#                          earlier (08:33–09:33 UTC → 07:03–08:03 UTC) after
#                          v3.39.7.5 deploy showed cron events firing at
#                          ~11:50 UTC consistently — a STRUCTURAL ~3h delay,
#                          not an outage. This is the same delay phenomenon
#                          documented in daily-ticker-report's daily.yml
#                          ("GitHub routinely executes cron jobs 90–120 min
#                          after the trigger time"). Setting cron earlier
#                          than the desired fire time is the standard
#                          workaround. Companion change: fast_tier.yml now
#                          uses workflow_run chaining to fire on deep_tier
#                          completion, eliminating the second cron delay.
#   v3.39.7.5 (2026-05-26) — schedule: pulled all 5 crons 1h 30min earlier
#                            (10:03–11:03 UTC → 08:33–09:33 UTC) to absorb
#                            GitHub Actions scheduler delays. On 2026-05-26
#                            crons were delayed ~1h 35min causing email to
#                            arrive at 16:35 CEST (target was 14:30 CEST).
#                            See cron block comment for details + trade-offs.
#   v3.4.0  (2026-05-21) — commit step: added state/extraction_log_*.jsonl
#                          to the `git add` list. The digester writes one
#                          file per day with architecture signals extracted
#                          from each transcript; pre-v3.4.0 this file was
#                          generated locally each run and destroyed at
#                          shutdown (never committed). See inline comment
#                          at the commit step for full rationale.
#   v3.38.5 (earlier)    — added state/deep_tier_diagnostics.json and
#                          state/transcript_status.json to the commit step
#                          (digester writes these but they live in state/
#                          root, not under state/digests/, so the prior
#                          `git add -A state/digests/` line missed them).
#   v3.39.3 (earlier)    — spread triggers 5x across 60-min window.

on:
  schedule:
    # v3.39.3: spread triggers + idempotency. v3.39.9 trimmed to THREE
    # attempts in a 60-minute window (was 5) at 30-min spacing, to match
    # fast_tier's 3-cron fallback cadence. The :03/:33 minute marks avoid
    # :00/:15/:30/:45 (GitHub Actions' peak contention). First successful
    # run writes state/deep_tier_diagnostics.json; later triggers see the
    # file dated today and exit cleanly in ~10s (idempotency check in
    # deep_tier.py). Mon-Sat (1-6) — Korean exchange and US markets active
    # Mon-Fri, Saturday added per user pref for Saturday catch-up briefs.
    #
    # Timing: window 06:33–07:33 UTC = 08:33–09:33 Munich CEST = 15:33–16:33
    # KST. Cron expression is set deliberately EARLIER than the desired fire
    # time because GitHub Actions structurally delays scheduled events by
    # 90–180 min (see v3.39.8 comment below + daily.yml in daily-ticker-report
    # for empirical evidence). With that delay, actual fire is expected at
    # ~08:00–10:30 UTC = 10:00–12:30 Munich. v3.39.9 pulled this window 30 min
    # earlier than v3.39.8 so deep_tier tends to clear the GitHub queue before
    # fast_tier's cron fallbacks (which stayed at 07:03–08:03 UTC).
    # v3.39.8 (2026-05-29): pulled crons another 1.5h earlier (08:33-09:33 UTC
    # → 07:03-08:03 UTC) after empirically confirming GitHub Actions delays
    # SCHEDULED cron events by 90-180 min consistently (not just on outage
    # days — this is the structural delay, same one already documented in
    # daily-ticker-report/.github/workflows/daily.yml). After v3.39.7.5 deploy
    # the deep_tier still consistently fired around 11:50 UTC (vs scheduled
    # 08:33 UTC) — ~3h 17min delay — leading to fast_tier firing around 14:00
    # UTC and email arriving at 16:00 Munich. Cron expression is now set
    # EARLIER than the gate window to compensate for the delay, same pattern
    # as daily.yml ("Cron starts at UTC 01 (= CET 02) so first fallback slot
    # is CET 02:19").
    #
    # Math: cron at 07:03 UTC + worst-case 180 min delay = 10:03 UTC fire =
    # 12:03 Munich. Email follows ~25 min later from fast_tier (chained via
    # workflow_run since v3.39.8 — see fast_tier.yml). Worst-case delivery
    # ~12:30 Munich = 1h 30min before 14:00 target.
    #
    # Korean broker trade-off: first cron now at 07:03 UTC = 16:03 KST, which
    # is 33 min after the 15:30 KST KRX close. Mirae notes typically publish
    # within ~30 min of close on news days. The 5-cron window now spans
    # 16:03–17:03 KST. Slightly tighter than v3.39.7.5's 17:33–18:33 KST but
    # still in the broker post-close publishing window for most days.
    # Yesterday (2026-05-28) and today (2026-05-29) BOTH had Mirae notes
    # published before 16:00 KST so this should not regress capture rate.
    - cron: "33 6 * * 1-6"     # 06:33 UTC = 08:33 CEST = 15:33 KST — primary
    - cron: "3 7 * * 1-6"      # 07:03 UTC = 09:03 CEST = 16:03 KST — fallback
    - cron: "33 7 * * 1-6"     # 07:33 UTC = 09:33 CEST = 16:33 KST — last safety attempt
  workflow_dispatch: {}

permissions:
  contents: write  # commits digests + caches back to repo

concurrency:
  group: memory-cycle-brief-deep
  cancel-in-progress: false

jobs:
  deep-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # PDF parsing + digester is slower than fast tier.
    # v3.40.1: 25 → 40. Layer 1 digesters now use the Message Batches API with
    # in-job polling — up to two sequential ≤8-min polls (transcripts, then
    # broker notes) on document-heavy days, on top of scraping + any sync
    # fallbacks. Quiet days (nothing to digest) submit no batch and finish in
    # ~2-3 min as before. 40 leaves margin for the worst case.

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      # v3.4.9 — YAML-LEVEL IDEMPOTENCY GATE.
      #
      # Mirrors the pattern from daily-ticker-report/.github/workflows/daily.yml
      # and fast_tier.yml v3.4.9. The gate runs BEFORE Python setup and
      # dependency install, so when a follow-up scheduled cron fires after the
      # first run of the day already succeeded, the workflow does ~8 seconds
      # of work (checkout + gate + echo) instead of the ~60 seconds it used to
      # take (checkout + python install + deps install + deep_tier.py startup
      # + internal idempotency check exit).
      #
      # 2 daily fallback crons (07:03 / 07:33 UTC as of v3.39.9) × ~52 seconds
      # saved per no-op × Mon-Sat = meaningful reduction in GitHub Actions
      # minutes consumed by no-op deep-tier runs.
      #
      # Two gate conditions:
      #   1. FORCE_RUN=1 (manual workflow_dispatch) → always run, bypass check.
      #   2. state/deep_tier_diagnostics.json dated today → already ran, skip.
      # Otherwise → run.
      #
      # Uses the runner's pre-installed Python 3 via `python3` — no setup-python
      # or pip install step needed for the gate itself.
      #
      # deep_tier.py keeps its internal idempotency check as belt-and-suspenders
      # (handles FORCE_RUN path and provides defense in depth).
      - name: Decide whether to run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          force_run = os.environ.get("FORCE_RUN") == "1"
          event_name = os.environ.get("EVENT_NAME", "")

          if force_run:
              run, reason = True, f"manual_dispatch (event={event_name}, FORCE_RUN=1)"
          else:
              diag_path = Path("state/deep_tier_diagnostics.json")
              already_ran = False
              if diag_path.exists():
                  try:
                      diag = json.loads(diag_path.read_text())
                      already_ran = (diag.get("run_date") == today)
                  except Exception as e:
                      print(f"WARN: could not parse {diag_path}: {e}; treating as not-run")

              if already_ran:
                  run, reason = False, f"already_ran_today ({today} in deep_tier_diagnostics.json)"
              else:
                  run, reason = True, "ready (deep tier not run today yet)"

          out_path = os.environ["GITHUB_OUTPUT"]
          with open(out_path, "a") as f:
              f.write(f"run={'true' if run else 'false'}\n")
              f.write(f"reason={reason}\n")
              f.write(f"today={today}\n")
              f.write(f"event={event_name}\n")
          print(f"gate decision: run={run}")
          print(f"gate reason:   {reason}")
          print(f"today (UTC):   {today}")
          print(f"event:         {event_name}")
          PY

      - name: Stop early (no-op skip)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping run."
          echo "  Reason: ${{ steps.gate.outputs.reason }}"
          echo "  Today:  ${{ steps.gate.outputs.today }}"
          echo "  Event:  ${{ steps.gate.outputs.event }}"
          echo ""
          echo "Manual override: re-run via Actions UI 'Run workflow' button (FORCE_RUN=1 bypasses gate)."

      - name: Set up Python
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deep tier (transcripts + Korean broker PDFs + Layer 1 digester)
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # v3.39.3.1: SAMSUNG_GMAIL_USER / SAMSUNG_GMAIL_APP_PW removed —
          # Samsung Securities Gmail IMAP source deleted (was never configured;
          # see src/data/korean_brokers.py changelog for rationale).
          HAIKU_MODEL_OVERRIDE: ${{ secrets.HAIKU_MODEL_OVERRIDE }}
          # v3.33: Bright Data residential proxy for Yahoo Finance transcript
          # scraping. Yahoo blocks datacenter IPs (incl. GitHub Actions runners)
          # with 404. Format: http://USER-country-us:PASS@brd.superproxy.io:33335
          # The transcript scraper appends a per-request -session-{n} token
          # for residential-IP rotation. If unset, Yahoo fallback degrades to
          # "nothing" gracefully; Motley Fool + IR continue to work.
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
        run: |
          python -m src.deep_tier

      - name: Commit digests + caches
        if: ${{ steps.gate.outputs.run == 'true' && success() }}
        env:
          # v3.4.9.1: same fix as fast_tier.yml — bypass actions/checkout
          # extraheader auth flake by embedding the token in origin URL.
          # Latent here pre-v3.4.9 because the prior `git pull --rebase ... || true`
          # pattern silently swallowed every auth failure (idempotency was broken
          # but workflow status was green). With v3.4.9's fail-loudly retry,
          # deep_tier would hit the SAME auth failure that fast_tier hit
          # 2026-05-23 15:45 UTC — see fast_tier.yml comment + actions/checkout#664.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "memory-cycle-brief-bot"
          git config --global user.email "bot@memory-cycle-brief"
          # v3.4.9.1: token-in-URL auth (see env comment above for rationale).
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # v3.4.9: WHOLESALE state/ add — replaces the explicit allowlist
          # below. Same fix as fast_tier.yml v3.4.9. The prior explicit
          # allowlist (digests/, cache/, deep_tier_diagnostics.json,
          # transcript_status.json, extraction_log_*.jsonl) silently missed
          # any new state files added by future framework versions, leaving
          # them as untracked modified files in the working tree. That
          # caused `git pull --rebase` (below) to fail with "cannot pull
          # with rebase: You have unstaged changes" — and because the
          # rebase failure was swallowed by `|| true` (pre-v3.4.9), the
          # workflow reported SUCCESS while never actually pushing the
          # idempotency marker (deep_tier_diagnostics.json) to main. This
          # broke deep_tier's idempotency: all 5 scheduled runs each day
          # would run the full pipeline because their fresh checkout
          # didn't see today's diagnostics file.
          #
          # Wholesale add captures any new state file the framework adds
          # without needing an allowlist update.
          git add -A state/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Deep tier digests $(date -u +%Y-%m-%d)"
          # v3.4.9: FAIL LOUDLY on rebase/push errors. Mirrors fast_tier.yml's
          # v3.39.7.4 hardening. The prior `git pull --rebase || true` pattern
          # silently swallowed the exact failure that's been breaking
          # deep_tier idempotency: when there are unstaged tracked changes
          # (now fixed by `git add -A state/` above) or a rebase conflict,
          # the rebase fails, `|| true` swallows it, then `git push` either
          # silently no-ops or pushes a commit that's behind origin. Either
          # way, today's deep_tier_diagnostics.json never lands on main,
          # and the next 4 scheduled deep_tier runs each repeat full work
          # because they don't see today's idempotency marker.
          if ! git pull --rebase origin main; then
            echo "::error::git pull --rebase origin main failed before push"
            exit 1
          fi
          if git push; then
            echo "Push succeeded on first attempt."
          else
            echo "First push failed; retrying after 10s..."
            sleep 10
            if ! git pull --rebase origin main; then
              echo "::error::git pull --rebase failed on retry"
              exit 1
            fi
            if ! git push; then
              echo "::error::git push failed on retry — deep_tier_diagnostics.json NOT persisted to main. Subsequent scheduled deep_tier runs will not hit idempotency and will repeat full work."
              exit 1
            fi
            echo "Push succeeded on retry."
          fi
