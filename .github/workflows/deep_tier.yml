name: Memory Cycle Brief — Deep Tier (overnight)

# Revision history (most recent at top — inline markers throughout the file
# detail the specific section a revision touched):
#   v3.4.0  (2026-05-21) — commit step: added state/extraction_log_*.jsonl
#                          to the `git add` list. The digester writes one
#                          file per day with architecture signals extracted
#                          from each transcript; pre-v3.4.0 this file was
#                          generated locally each run and destroyed at
#                          shutdown (never committed). See inline comment
#                          at the commit step for full rationale.
#   v3.38.5 (earlier)    — added state/deep_tier_diagnostics.json and
#                          state/transcript_status.json to the commit step
#                          (digester writes these but they live in state/
#                          root, not under state/digests/, so the prior
#                          `git add -A state/digests/` line missed them).
#   v3.39.3 (earlier)    — spread triggers 5x across 60-min window.

on:
  schedule:
    # v3.39.3: spread triggers + idempotency. Five attempts in a 60-minute
    # window at odd minute marks (avoiding :00, :15, :30, :45 which are
    # GitHub Actions' peak contention). First successful run writes
    # state/deep_tier_diagnostics.json; later triggers see the file dated
    # today and exit cleanly in ~10s (idempotency check in deep_tier.py).
    # Mon-Sat (1-6) — Korean exchange and US markets active Mon-Fri,
    # Saturday added per user pref for Saturday catch-up briefs.
    #
    # Timing: 10:00 UTC = 12:00 Munich CEST = 19:00 KST — end of Korean
    # business day. Captures the FULL Korean broker post-close publishing
    # window (15:30 KST KRX close → 19:00 KST desk close). US transcript
    # availability ~98% by this time (vs 94% at 08:00 UTC original).
    - cron: "3 10 * * 1-6"     # 10:03 UTC
    - cron: "17 10 * * 1-6"    # 10:17 UTC
    - cron: "33 10 * * 1-6"    # 10:33 UTC
    - cron: "47 10 * * 1-6"    # 10:47 UTC
    - cron: "3 11 * * 1-6"     # 11:03 UTC — last safety attempt
  workflow_dispatch: {}

permissions:
  contents: write  # commits digests + caches back to repo

concurrency:
  group: memory-cycle-brief-deep
  cancel-in-progress: false

jobs:
  deep-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # PDF parsing + digester is slower than fast tier

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      # v3.4.9 — YAML-LEVEL IDEMPOTENCY GATE.
      #
      # Mirrors the pattern from daily-ticker-report/.github/workflows/daily.yml
      # and fast_tier.yml v3.4.9. The gate runs BEFORE Python setup and
      # dependency install, so when a follow-up scheduled cron fires after the
      # first run of the day already succeeded, the workflow does ~8 seconds
      # of work (checkout + gate + echo) instead of the ~60 seconds it used to
      # take (checkout + python install + deps install + deep_tier.py startup
      # + internal idempotency check exit).
      #
      # 4 daily fallback crons (10:17 / 10:33 / 10:47 / 11:03 UTC) × ~52 seconds
      # saved per no-op × Mon-Sat = roughly 5x reduction in GitHub Actions
      # minutes consumed by no-op deep-tier runs.
      #
      # Two gate conditions:
      #   1. FORCE_RUN=1 (manual workflow_dispatch) → always run, bypass check.
      #   2. state/deep_tier_diagnostics.json dated today → already ran, skip.
      # Otherwise → run.
      #
      # Uses the runner's pre-installed Python 3 via `python3` — no setup-python
      # or pip install step needed for the gate itself.
      #
      # deep_tier.py keeps its internal idempotency check as belt-and-suspenders
      # (handles FORCE_RUN path and provides defense in depth).
      - name: Decide whether to run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          force_run = os.environ.get("FORCE_RUN") == "1"
          event_name = os.environ.get("EVENT_NAME", "")

          if force_run:
              run, reason = True, f"manual_dispatch (event={event_name}, FORCE_RUN=1)"
          else:
              diag_path = Path("state/deep_tier_diagnostics.json")
              already_ran = False
              if diag_path.exists():
                  try:
                      diag = json.loads(diag_path.read_text())
                      already_ran = (diag.get("run_date") == today)
                  except Exception as e:
                      print(f"WARN: could not parse {diag_path}: {e}; treating as not-run")

              if already_ran:
                  run, reason = False, f"already_ran_today ({today} in deep_tier_diagnostics.json)"
              else:
                  run, reason = True, "ready (deep tier not run today yet)"

          out_path = os.environ["GITHUB_OUTPUT"]
          with open(out_path, "a") as f:
              f.write(f"run={'true' if run else 'false'}\n")
              f.write(f"reason={reason}\n")
              f.write(f"today={today}\n")
              f.write(f"event={event_name}\n")
          print(f"gate decision: run={run}")
          print(f"gate reason:   {reason}")
          print(f"today (UTC):   {today}")
          print(f"event:         {event_name}")
          PY

      - name: Stop early (no-op skip)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping run."
          echo "  Reason: ${{ steps.gate.outputs.reason }}"
          echo "  Today:  ${{ steps.gate.outputs.today }}"
          echo "  Event:  ${{ steps.gate.outputs.event }}"
          echo ""
          echo "Manual override: re-run via Actions UI 'Run workflow' button (FORCE_RUN=1 bypasses gate)."

      - name: Set up Python
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deep tier (transcripts + Korean broker PDFs + Layer 1 digester)
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # v3.39.3.1: SAMSUNG_GMAIL_USER / SAMSUNG_GMAIL_APP_PW removed —
          # Samsung Securities Gmail IMAP source deleted (was never configured;
          # see src/data/korean_brokers.py changelog for rationale).
          HAIKU_MODEL_OVERRIDE: ${{ secrets.HAIKU_MODEL_OVERRIDE }}
          # v3.33: Bright Data residential proxy for Yahoo Finance transcript
          # scraping. Yahoo blocks datacenter IPs (incl. GitHub Actions runners)
          # with 404. Format: http://USER-country-us:PASS@brd.superproxy.io:33335
          # The transcript scraper appends a per-request -session-{n} token
          # for residential-IP rotation. If unset, Yahoo fallback degrades to
          # "nothing" gracefully; Motley Fool + IR continue to work.
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
        run: |
          python -m src.deep_tier

      - name: Commit digests + caches
        if: ${{ steps.gate.outputs.run == 'true' && success() }}
        run: |
          set -euo pipefail
          git config --global user.name "memory-cycle-brief-bot"
          git config --global user.email "bot@memory-cycle-brief"
          # v3.4.9: WHOLESALE state/ add — replaces the explicit allowlist
          # below. Same fix as fast_tier.yml v3.4.9. The prior explicit
          # allowlist (digests/, cache/, deep_tier_diagnostics.json,
          # transcript_status.json, extraction_log_*.jsonl) silently missed
          # any new state files added by future framework versions, leaving
          # them as untracked modified files in the working tree. That
          # caused `git pull --rebase` (below) to fail with "cannot pull
          # with rebase: You have unstaged changes" — and because the
          # rebase failure was swallowed by `|| true` (pre-v3.4.9), the
          # workflow reported SUCCESS while never actually pushing the
          # idempotency marker (deep_tier_diagnostics.json) to main. This
          # broke deep_tier's idempotency: all 5 scheduled runs each day
          # would run the full pipeline because their fresh checkout
          # didn't see today's diagnostics file.
          #
          # Wholesale add captures any new state file the framework adds
          # without needing an allowlist update.
          git add -A state/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Deep tier digests $(date -u +%Y-%m-%d)"
          # v3.4.9: FAIL LOUDLY on rebase/push errors. Mirrors fast_tier.yml's
          # v3.39.7.4 hardening. The prior `git pull --rebase || true` pattern
          # silently swallowed the exact failure that's been breaking
          # deep_tier idempotency: when there are unstaged tracked changes
          # (now fixed by `git add -A state/` above) or a rebase conflict,
          # the rebase fails, `|| true` swallows it, then `git push` either
          # silently no-ops or pushes a commit that's behind origin. Either
          # way, today's deep_tier_diagnostics.json never lands on main,
          # and the next 4 scheduled deep_tier runs each repeat full work
          # because they don't see today's idempotency marker.
          if ! git pull --rebase origin main; then
            echo "::error::git pull --rebase origin main failed before push"
            exit 1
          fi
          if git push; then
            echo "Push succeeded on first attempt."
          else
            echo "First push failed; retrying after 10s..."
            sleep 10
            if ! git pull --rebase origin main; then
              echo "::error::git pull --rebase failed on retry"
              exit 1
            fi
            if ! git push; then
              echo "::error::git push failed on retry — deep_tier_diagnostics.json NOT persisted to main. Subsequent scheduled deep_tier runs will not hit idempotency and will repeat full work."
              exit 1
            fi
            echo "Push succeeded on retry."
          fi
