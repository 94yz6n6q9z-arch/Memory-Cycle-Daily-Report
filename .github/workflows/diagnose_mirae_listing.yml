name: Phase D — Mirae listing diagnostic

# Runs `scripts/diagnose_mirae_listing.py` against the Mirae Asset English
# research listing and dumps the output to the Actions log. Use this to find
# out what selector format the row links use, since v3.39.3 Phase C confirmed
# the old `messageId=\\d+` regex finds zero matches in the current page.
#
# Manual trigger only — no schedule. The script writes nothing to state and
# does not commit. Read the output from the Actions log; copy-paste into the
# next session for analysis.
#
# Safe to run repeatedly. ~30s runtime; ~110 KB transfer from miraeasset.com.

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (requests + beautifulsoup4 only)
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Phase D diagnostic
        run: |
          python scripts/diagnose_mirae_listing.py
