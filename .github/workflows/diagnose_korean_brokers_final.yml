name: Diagnose Korean Brokers — FINAL

# Consolidated final diagnostic. Dumps everything inline to the log;
# no artifact retrieval needed. Just copy the log step output.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run final diagnostic
        run: |
          python scripts/diagnose_korean_brokers_final.py
