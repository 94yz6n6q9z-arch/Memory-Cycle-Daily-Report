# HBM-per-accelerator reference for the Decode HBM Captive Ratio
# (DHCR) indicator (v3.4.0).
#
# Tracks HBM capacity per AI accelerator across generations. The DHCR
# module computes "frontier HBM per accelerator" as the maximum HBM GB
# shipped by any single accelerator generation in the trailing 90-day
# window of each historical timestamp.
#
# Why this matters for the captive ratio:
#   The supply-side capacity equation is HBM_per_accelerator × units_shipped.
#   If accelerators keep packing MORE HBM per chip (B200 192GB → Rubin
#   384GB), and shipments grow, total HBM demand stays strong even if
#   per-token KV efficiency improves — because the larger HBM pool gets
#   filled by longer context per workload (Raul's economic frontier
#   model: market consumes context up to capacity).
#
# Non-HBM AI accelerators (Cerebras WSE SRAM, Groq SRAM, etc.) are tracked
# separately under `non_hbm_accelerators` because they represent the
# substitution risk — workloads running on those are not consuming HBM
# at all.
#
# Update cadence: per launch (~3-6 months between flagship generations).
# Sources: vendor product pages, datasheets, earnings call disclosures.

schema_version: 1

# ============================================================
# NVIDIA AI accelerators (dominant share)
# ============================================================

nvidia:
  - generation: "H100"
    release_date: "2023-03-21"
    hbm_gb_per_chip: 80
    hbm_type: "HBM3"
    chip_form: "single die"
    notes: "Launch generation for the AI cycle."
    source_url: "https://www.nvidia.com/en-us/data-center/h100/"

  - generation: "H200"
    release_date: "2024-03-18"
    hbm_gb_per_chip: 141
    hbm_type: "HBM3e"
    chip_form: "single die"
    notes: "First HBM3e production deployment. SK Hynix dominant supplier."
    source_url: "https://www.nvidia.com/en-us/data-center/h200/"

  - generation: "B100"
    release_date: "2024-10-15"
    hbm_gb_per_chip: 192
    hbm_type: "HBM3e"
    chip_form: "single die"
    notes: "Blackwell architecture, single-die variant."

  - generation: "B200"
    release_date: "2024-11-20"
    hbm_gb_per_chip: 192
    hbm_type: "HBM3e"
    chip_form: "single die (dual reticle)"
    notes: "Dual-reticle Blackwell. 192GB HBM3e in 8 stacks."

  - generation: "GB200"
    release_date: "2025-02-15"
    hbm_gb_per_chip: 384      # superchip = 2 B200 dies + Grace CPU
    hbm_type: "HBM3e"
    chip_form: "superchip (2 GPU dies + 1 CPU)"
    notes: "Blackwell superchip. Effective HBM per accelerator unit doubles."

  - generation: "B300"
    release_date: "2025-09-30"
    hbm_gb_per_chip: 288
    hbm_type: "HBM3e"
    chip_form: "single die"
    notes: "Blackwell-Ultra. 288GB per GPU via 12-Hi stacks."

  - generation: "GB300"
    release_date: "2025-11-15"
    hbm_gb_per_chip: 576      # superchip = 2 B300 dies
    hbm_type: "HBM3e"
    chip_form: "superchip"

  - generation: "Rubin (projected)"
    release_date: "2026-Q4"   # projected
    hbm_gb_per_chip: 288
    hbm_type: "HBM4"
    chip_form: "single die"
    notes: "First HBM4 production. Bandwidth ~2x HBM3e at similar capacity. Capacity scales come with Rubin Ultra."
    confidence: "projected"

  - generation: "Rubin Ultra (projected)"
    release_date: "2027-H2"
    hbm_gb_per_chip: 1024     # projected based on NVIDIA hints — 16-Hi HBM4 stacks
    hbm_type: "HBM4"
    chip_form: "superchip"
    confidence: "projected"
    notes: "Speculative based on NVIDIA roadmap. Will represent ~5x HBM3e baseline if delivered."

