# ============================================================
# Non-HBM AI accelerators (HBM-substitution risk)
# ============================================================

non_hbm_accelerators:
  # Workloads running on these consume ZERO HBM. They are the structural
  # substitution risk for SK Hynix's HBM moat. Track market share —
  # if these capture material AI compute share, that's bearish HBM
  # regardless of efficiency math.
  - vendor: "Cerebras"
    generation: "WSE-3"
    release_date: "2024-03-13"
    memory_type: "On-die SRAM"
    on_die_memory_gb: 44
    external_memory: "None (pure SRAM)"
    ai_compute_share_estimate: "<1%"
    notes: "Single-wafer chip with 44GB SRAM. Pure substitution case but limited share."
    listed_ipo_date: "2026-05-14"

  - vendor: "Groq"
    generation: "LPU v2"
    release_date: "2025-02-20"
    memory_type: "On-die SRAM + external DDR"
    on_die_memory_gb: 230   # cumulative across rack-scale deployment
    external_memory: "DDR5"
    ai_compute_share_estimate: "<1%"
    notes: "Inference-only. Uses commodity DDR for capacity tier."

  - vendor: "Etched"
    generation: "Sohu"
    release_date: "2025-08-01"
    memory_type: "Transformer-specific ASIC with on-die SRAM"
    on_die_memory_gb: 144
    external_memory: "limited"
    ai_compute_share_estimate: "<0.5%"
    notes: "Speculative new entrant. Watch but not material yet."

# ============================================================
# Derived: frontier HBM-per-accelerator timeline
# ============================================================
# Computed by dhcr.py from the entries above. For each quarter,
# takes the max hbm_gb_per_chip from nvidia + amd shipping in
# that quarter or earlier. Custom silicon excluded from frontier
# because it's not openly purchasable.

derived_frontier_timeline_notes: |
  The DHCR uses frontier_hbm_per_accelerator = max(nvidia, amd) shipping
  at each point in time. Custom hyperscaler silicon excluded because
  it's captive (not part of merchant market). Non-HBM accelerators
  excluded because they don't consume HBM at all (they're the
  substitution risk, tracked separately).
