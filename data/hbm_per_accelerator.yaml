# HBM-per-accelerator REFERENCE (v3.4.5 schema-only).
# Live entries live in state/hbm_per_accelerator_state.json
# (sole writer: src/analysis/dhcr_accelerator_aggregator.py).

schema_version: '2.0'
framework_session_date: '2026-05-22'
description: Accelerator catalog REFERENCE. STABLE. Live entries in state/hbm_per_accelerator_state.json.
vendor_categories:
  nvidia: Hopper, Blackwell, Rubin
  amd: AMD Instinct MI300+
  custom_silicon: TPU, Trainium, Maia, MTIA, Inferentia
  non_hbm_accelerators: Substitution-risk parts (Cerebras, Groq, Etched)
frontier_hbm_computation_note: frontier_hbm = max hbm_gb in trailing 90 days. Non-HBM excluded from frontier.
extraction_fields:
  new_accelerator_announcement:
    vendor: nvidia | amd | google | aws | meta | microsoft | tesla
    name: string
    hbm_gb: numeric_or_null
    release_date: iso_date
    generation: string
    category: nvidia | amd | custom_silicon | non_hbm_accelerators
    notes: string
aggregator_config:
  extraction_log_lookback_days: 180
  state_file_path: state/hbm_per_accelerator_state.json
  frontier_window_days: 90
source_authority_tier:
  tier_a:
  - Nvidia GTC keynote
  - AMD AI Day
  - vendor product pages
  - hyperscaler tech days
  tier_b:
  - SemiAnalysis
  - Toms Hardware
  tier_c:
  - DigiTimes
