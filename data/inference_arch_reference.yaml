  # as of Q2 2026. They are the upper bound of what's being economically
  # consumed today. As efficiency improves, these will expand (per Raul's
  # mental model: market consumes context up to economic frontier).
  consumer_chat:
    typical_context_tokens: 30000
    max_offered_context_tokens: 1000000
    economic_max_context_tokens: 50000   # what's actually being served at scale
    sources:
      - "ChatGPT Plus default = 32K; Pro = 128K"
      - "Claude.ai default = 200K"
      - "Gemini consumer = 1M offered, ~10-30K typical"
  developer_api:
    typical_context_tokens: 24000
    max_offered_context_tokens: 1000000
    economic_max_context_tokens: 100000
  coding_agents:
    typical_context_tokens: 280000
    max_offered_context_tokens: 1000000
    economic_max_context_tokens: 500000
    sources:
      - "Cursor 200K default"
      - "Claude Code 500K"
      - "Devin reportedly 1M for repo context"
  rag_search:
    typical_context_tokens: 18000
    max_offered_context_tokens: 200000
    economic_max_context_tokens: 50000
  enterprise_vertical_agents:
    typical_context_tokens: 350000
    max_offered_context_tokens: 2000000
    economic_max_context_tokens: 1000000
    confidence: "low"
    sources:
      - "Harvey AI legal: 500K-typical disclosed in case studies"
      - "Hebbia financial: 200K-1M depending on workflow"
