    notes: |
      This category is the leading edge. Today bounded by economics at ~1M.
      As efficiency drops KV by 4-8x in next 2 years, expect this to reach
      10M+ for full-enterprise-context workflows. Raul's mental model:
      the market WILL push to whatever is economically possible.
  creative_other:
