# Frontier inference model architecture REFERENCE (v3.4.5 schema-only).
# Live model entries live in state/inference_arch_state.json
# (sole writer: src/analysis/dhcr_arch_aggregator.py).

schema_version: '2.0'
framework_session_date: '2026-05-22'
description: Frontier inference model architecture reference. STABLE. Live model entries live in state/inference_arch_state.json.
kv_per_token_formula:
  gqa_class: kv_bytes_per_token = 2 * num_layers * num_kv_heads * head_dim * bytes_per_element / compression_factor
  mla_class: For MLA, num_kv_heads is replaced by mla_kv_lora_rank plus rope_dim.
bytes_per_element:
  FP16_BF16: 2
  FP8: 1
  INT4: 0.5
  INT2: 0.25
architecture_family_enum:
- GQA
- GQA-MoE
- MLA
- MLA-MoE
- MHA
closed_model_handling: Closed-model entries are excluded from frontier_kv. Stored under closed_models
  with confidence_band.
extraction_fields:
  new_frontier_model_release:
    name: string
    release_date: iso_date
    architecture_family: GQA | GQA-MoE | MLA | MLA-MoE | MHA
    num_layers: int
    num_kv_heads: int
    head_dim: int
    bytes_per_element: 2 | 1 | 0.5 | 0.25
    compression_factor: numeric default 1.0
    kv_kb_per_token: numeric optional
    source_url: string
aggregator_config:
  extraction_log_lookback_days: 180
  state_file_path: state/inference_arch_state.json
  frontier_window_days: 90
  open_only_for_frontier: true
source_authority_tier:
  tier_a:
  - arxiv paper
  - HuggingFace model card
  - official release blog
  tier_b:
  - SemiAnalysis
  - Papers with Code
  tier_c:
  - tech news
