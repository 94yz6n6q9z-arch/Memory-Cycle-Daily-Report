# Enterprise AI revenue reference for the Decode HBM Captive Ratio
# (DHCR) indicator (v3.4.0).
#
# The CENTRAL question of the DHCR (per Raul's mental model):
#   Is enterprise demand-pull growing faster than the supply-side capacity
#   creation rate (efficiency × HBM-per-accelerator)?
#
# If YES → context expands to fill capacity → HBM stays tight → bullish SK Hynix
# If NO  → capacity creation outruns demand → HBM gets slack → bearish SK Hynix
#
# This file tracks the demand-pull metrics: enterprise AI revenue growth
# across the major spend categories. The DHCR computes:
#   - YoY enterprise AI revenue growth (aggregate)
#   - Compares to YoY supply-capacity growth rate
#   - Direction signal from the difference
#
# Sources: quarterly earnings calls, segment disclosures, hyperscaler
# 10-Qs. All figures are best-public-estimates — providers often combine
# AI revenue with other cloud services or only mention "X% of growth"
# rather than absolute dollars. Where exact disclosure isn't available,
# the value is tagged with confidence.
#
# Cadence: updated quarterly as new earnings prints publish. Bootstrap
# back to Q1 2024 for trajectory.

schema_version: 1

# ============================================================
# Microsoft Azure AI services
# ============================================================
# Microsoft discloses Azure growth and the AI contribution to that
# growth in points. We back-solve from those disclosures.

microsoft_azure_ai:
  - quarter: "2024-Q1"
    revenue_usd_b_annualized: 5.0
    yoy_growth_pct: null            # not enough prior data
    confidence: "medium"
    source: "MSFT FY24 Q3 earnings call commentary"
    notes: "First quarter MSFT explicitly broke out Azure AI revenue contribution."

  - quarter: "2024-Q2"
    revenue_usd_b_annualized: 8.0
    yoy_growth_pct: null
    confidence: "medium"

  - quarter: "2024-Q3"
    revenue_usd_b_annualized: 10.0
    yoy_growth_pct: null
    confidence: "medium"
    notes: "Satya: 'Azure AI exited the quarter at $10B annualized run-rate.'"

  - quarter: "2024-Q4"
    revenue_usd_b_annualized: 13.0
    yoy_growth_pct: null
    confidence: "high"
    source: "MSFT FY25 Q1 earnings"

  - quarter: "2025-Q1"
