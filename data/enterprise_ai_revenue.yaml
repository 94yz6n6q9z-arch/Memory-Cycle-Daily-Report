# Enterprise AI revenue REFERENCE (v3.4.5 schema-only).
# Live quarterly entries live in state/enterprise_ai_revenue_state.json
# (sole writer: src/analysis/dhcr_revenue_aggregator.py).

schema_version: '2.0'
framework_session_date: '2026-05-22'
description: Enterprise AI revenue REFERENCE. STABLE. Live quarterly entries in state/enterprise_ai_revenue_state.json.
demand_pull_formula: demand_pull_yoy = 0.6 * enterprise_aggregate_yoy + 0.4 * nvidia_datacenter_yoy
category_definitions:
  microsoft_azure_ai: Azure OpenAI + Copilot enterprise + Azure AI services line item
  aws_ai_services: AWS Bedrock + Sagemaker + enterprise AI
  google_cloud_ai: Google Cloud AI segment + Vertex + Gemini enterprise
  oracle_ai_infra: OCI Gen2 AI infrastructure + cloud OCI growth
  nvidia_datacenter: Nvidia total datacenter revenue as overall AI demand proxy
extraction_fields:
  enterprise_ai_quarterly_revenue:
    category: microsoft_azure_ai | aws_ai_services | google_cloud_ai | oracle_ai_infra | nvidia_datacenter
    quarter: string e.g. 2026-Q2
    revenue_usd_b: numeric_or_null
    qoq_growth_pct: numeric_or_null
    yoy_growth_pct: numeric_or_null
    source_quote: string
aggregator_config:
  extraction_log_lookback_days: 120
  state_file_path: state/enterprise_ai_revenue_state.json
source_authority_tier:
  tier_a:
  - MSFT/AMZN/GOOGL/ORCL/NVDA earnings calls
  tier_b:
  - SEC 10-Q/10-K filings
  - Mirae/KB hyperscaler analysis
  tier_c:
  - tech news estimates
