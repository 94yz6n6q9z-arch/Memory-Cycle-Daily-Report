  yoy_growth_pct: 175.0                       # weighted average
  nvidia_datacenter_yoy_pct: 69.0             # decelerating from 400%+ peaks
  hyperscaler_capex_yoy_pct: 96.0
  confidence: "high for aggregate growth direction, medium for absolute level"

  # Direction interpretation per Raul's mental model:
  # - Enterprise AI revenue still growing 150%+ YoY = demand pull strong
  # - NVIDIA datacenter growth decelerating but still 60-70% YoY
  # - Hyperscaler capex still accelerating
  # Net: demand-pull is keeping pace with or exceeding capacity creation
  # → bullish for HBM captive ratio

  driver_notes:
    - "Enterprise vertical agents (Harvey, Hebbia, Sierra, Adept) still in adoption ramp"
    - "OpenAI's $10B Cerebras contract is non-HBM but is a single-vendor outlier"
    - "Oracle/OpenAI $30B+ RPO indicates multi-year commitment to HBM-based infrastructure"
    - "MSFT Azure AI deceleration to 152% YoY is first slowdown signal — watch Q2"
